---
image: docker.io/library/maven:3-eclipse-temurin-21

stages:
  - test
  - lint
  - connector-test
  - nix
  - deploy

include:
  - template: Jobs/Dependency-Scanning.latest.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

.my-rules: &my-rules
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_ID  # Execute jobs in merge request context
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"  # manual run via GitLab UI

workflow:
  <<: *my-rules

variables:
  AST_ENABLE_MR_PIPELINES: "true"
  GIT_SUBMODULE_STRATEGY: recursive
  MAVEN_ARGS: "--no-transfer-progress -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository/
    - litterbox-web/target/

################################################################################
# test

litterbox-web-test:
  stage: test
  needs: []
  coverage: '/Instruction Coverage: \d+.\d+ %/'
  services:
    - name: docker.io/library/mariadb:11.8
      alias: mariadb
      variables:
        MARIADB_ROOT_PASSWORD: synthetic
  before_script:
    - cd litterbox-web
  script:
    - mvn clean test -Dfrontend.build.skip=true
    - mvn jacoco:report
  after_script:
    - sh $CI_PROJECT_DIR/scripts/coverage.sh $JACOCO_CSV_LOCATION
    - sh $CI_PROJECT_DIR/scripts/coverage_metrics.sh "litterbox_web" $JACOCO_CSV_LOCATION >> metrics.txt
  variables:
    JACOCO_CSV_LOCATION: "$CI_PROJECT_DIR/litterbox-web/target/site/jacoco/jacoco.csv"
    FF_NETWORK_PER_BUILD: "true"
    LITTERBOX_TEST_DB_URL: "jdbc:mariadb://mariadb:3306/"
    LITTERBOX_TEST_DB_USER: root
    LITTERBOX_TEST_DB_PASSWORD: synthetic
  rules:
    - when: on_success
      allow_failure: false
      changes:
        paths:
          - litterbox-web/**/*
  artifacts:
    reports:
      metrics: metrics.txt
      coverage_report:
        coverage_format: jacoco
        path: litterbox-web/target/site/jacoco/jacoco.xml
      junit:
        - litterbox-web/target/surefire-reports/TEST-*.xml

.python-test: &python-test-template
  stage: connector-test
  image: docker.io/library/python:$PYTHON_VERSION
  needs: []
  before_script:
    - pip install uv
    - cd connectors/$SUBPROJECT
    - uv sync --all-extras --all-groups
  after_script:
    - sed -i "s|/connectors/$SUBPROJECT/src</source>|</source>|" connectors/$SUBPROJECT/coverage.xml
    - sed -i "s|filename=\"|filename=\"connectors/$SUBPROJECT/src/|" connectors/$SUBPROJECT/coverage.xml
  cache: []
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: connectors/$SUBPROJECT/coverage.xml
      junit: connectors/$SUBPROJECT/test-report.xml
  rules:
    - when: on_success
      allow_failure: false
      changes:
        paths:
          - connectors/$SUBPROJECT/**/*

test:code_readability:
  <<: *python-test-template
  tags:
    # our CI VMs emulate an older CPU that does not work with more recent
    # versions of PyTorch
    - bare-metal
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.13"
          - "3.14"
  variables:
    MODEL_VERSION_ID: 5
    SUBPROJECT: code_readability
  script:
    - apt-get update
    - apt-get install -y libgl1
    - >
      curl
      --header "Authorization: Bearer $CI_JOB_TOKEN"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/ml_models/$MODEL_VERSION_ID/files/pytorch_model.bin"
      >
      pytorch_model.bin
    - >
      MODEL_PATH=$(pwd)/pytorch_model.bin
      uv run pytest
      --junitxml=test-report.xml
      --cov=src --cov=tests --cov-branch
      --cov-report=term-missing --cov-report xml:coverage.xml
      tests

################################################################################
# lint

check-licence-headers-reuse:
  stage: lint
  image:
    name: docker.io/fsfe/reuse
    entrypoint: [""]
  needs: []
  cache: []
  script:
    - reuse lint

.java-lint: &java-lint-template
  stage: lint
  needs: []
  before_script:
    - cd $SUBDIR
  variables:
    SUBDIR: "litterbox-web"
  rules:
    - if: '$CI_MERGE_REQUEST_TITLE =~ /^(Draft|WIP):/'
      allow_failure: true
      changes:
        paths:
          - $SUBDIR/**/*
    - when: on_success
      allow_failure: false
      changes:
        paths:
          - $SUBDIR/**/*
    - when: on_success
      allow_failure: false
      changes:
        paths:
          - $SUBDIR/**/*

.python-lint: &python-lint-template
  stage: lint
  image: docker.io/library/python:$PYTHON_VERSION
  needs: []
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.13"
        SUBPROJECT:
          - api
          - code_completion_dummy
          - code_readability
  before_script:
    - pip install uv
    - cd connectors/$SUBPROJECT
    - uv lock --check
    - uv sync --all-extras --dev
  cache: []
  rules:
    - if: '$CI_MERGE_REQUEST_TITLE =~ /^(Draft|WIP):/'
      allow_failure: true
      changes:
        paths:
          - connectors/$SUBPROJECT/**/*
    - when: on_success
      allow_failure: false
      changes:
        paths:
          - connectors/$SUBPROJECT/**/*

.javascript-lint: &js-lint-template
  stage: lint
  image: docker.io/library/node:$NODE_VERSION
  needs: []
  parallel:
    matrix:
      - NODE_VERSION:
          - "24"
  before_script:
    - cd $WORKDIR
    - npm ci
  cache: []
  rules:
    - if: '$CI_MERGE_REQUEST_TITLE =~ /^(Draft|WIP):/'
      allow_failure: true
      changes:
        paths:
          - $WORKDIR/**/*
    - when: on_success
      allow_failure: false
      changes:
        paths:
          - $WORKDIR/**/*

check-licence-headers:
  <<: *java-lint-template
  script:
    - mvn license:check

check-formatting:
  <<: *java-lint-template
  script:
    - mvn spotless:check

checkstyle:
  <<: *java-lint-template
  script:
    - mvn checkstyle:check
  after_script:
    - cd $CI_PROJECT_DIR/litterbox-web
    - cat target/checkstyle-result.xml | $CI_PROJECT_DIR/scripts/checkstyle_report.sh "litterbox-web" > checkstyle-report.json
  rules:
    - if: '$CI_MERGE_REQUEST_TITLE =~ /^(Draft|WIP):/'
      allow_failure: true
      changes:
        paths:
          - litterbox-web/**/*
          - config/checkstyle/**/*
          - .gitlab-ci.yml
    - when: on_success
      allow_failure: false
      changes:
        paths:
          - litterbox-web/**/*
          - config/checkstyle/**/*
          - .gitlab-ci.yml
  artifacts:
    when: always
    reports:
      codequality:
        - litterbox-web/checkstyle-report.json

spotbugs:
  <<: *java-lint-template
  script:
    - mvn -Pstatic-analysis compile spotbugs:check -Dfrontend.build.skip=true
  rules:
    - if: '$CI_MERGE_REQUEST_TITLE =~ /^(Draft|WIP):/'
      allow_failure: true
      changes:
        paths:
          - litterbox-web/**/*
          - config/spotbugs/**/*
          - .gitlab-ci.yml
    - when: on_success
      allow_failure: false
      changes:
        paths:
          - litterbox-web/**/*
          - config/spotbugs/**/*
          - .gitlab-ci.yml
  artifacts:
    when: always
    paths:
      - litterbox-web/target/spotbugsXml.xml

python-lint:
  <<: *python-lint-template
  script:
    - uv run isort --check-only .
    - uv run ruff format --diff --check .
    - uv run mypy .
    - uv run ruff check --output-format=gitlab > $CI_PROJECT_DIR/ruff-report.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/ruff-report.json

js-lint:
  <<: *js-lint-template
  variables:
    WORKDIR: connectors/screenshot
  script:
    - npm run lint
    - npm run format:ci

frontend-lint:
  <<: *js-lint-template
  variables:
    WORKDIR: frontend
  script:
    - npm run lint
    - npm run format:ci

frontend-typecheck:
  <<: *js-lint-template
  variables:
    WORKDIR: frontend
  script:
    - npm run typecheck

frontend-test:
  stage: test
  image: docker.io/library/node:24
  needs: []
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm test -- --run
  cache: []
  rules:
    - changes:
        - frontend/**/*

frontend-e2e-test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.0-noble
  needs: []
  services:
    - name: docker.io/library/mariadb:11.8
      alias: mariadb
      variables:
        MARIADB_DATABASE: litterbox_ci_synthetic
        MARIADB_USER: litterbox_ci_synthetic
        MARIADB_PASSWORD: litterbox_ci_synthetic
        MARIADB_ROOT_PASSWORD: synthetic
  variables:
    FF_NETWORK_PER_BUILD: "true"
    SPRING_PROFILES_ACTIVE: public-web
    LITTERBOX_DB_URL: jdbc:mariadb://mariadb:3306/litterbox_ci_synthetic
    LITTERBOX_DB_USER: litterbox_ci_synthetic
    LITTERBOX_DB_PASSWORD: litterbox_ci_synthetic
    LITTERBOX_SOURCE_STORAGE_ROOT: /tmp/litterbox-ci-synthetic-artifacts
    LITTERBOX_WEB_STATIC_LOCATION: "file:$CI_PROJECT_DIR/frontend/dist/"
    PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080/litterbox/
    PLAYWRIGHT_REAL_API: true
  before_script:
    - apt-get update
    - apt-get install -y curl openjdk-21-jdk-headless maven
    - cd frontend
    - npm ci
  script:
    - npm run build
    - cd ..
    - mvn -f litterbox-web/pom.xml -DskipTests package
    - java -jar litterbox-web/target/litterbox-web-*.jar > /tmp/litterbox-web.log 2>&1 &
    - export LITTERBOX_WEB_PID=$!
    - trap 'kill "$LITTERBOX_WEB_PID"' EXIT
    - >
      for attempt in $(seq 1 60); do
        if curl --fail --silent http://127.0.0.1:8080/litterbox/api/v1/capabilities > /dev/null; then
          break;
        fi;
        if [ "$attempt" -eq 60 ]; then
          cat /tmp/litterbox-web.log;
          exit 1;
        fi;
        sleep 1;
      done
    - cd frontend
    - npm run test:ui
  cache: []
  rules:
    - changes:
        - frontend/**/*
        - litterbox-web/pom.xml
        - litterbox-web/src/**/*
        - .gitlab-ci.yml

################################################################################
# nix

nix-build-jar:
  stage: nix
  needs: []
  image: docker.io/nixos/nix:latest
  allow_failure: true
  script:
    - >
      nix
      --extra-experimental-features nix-command
      --extra-experimental-features flakes
      build
      --print-build-logs
      .#litterbox-web-jar
  cache: []
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - changes:
        - flake.nix
        - flake.lock
        - litterbox-web/pom.xml
        - litterbox-web/default.nix
        - litterbox-web/src/**/*

nix-build-frontend:
  stage: nix
  needs: []
  image: docker.io/nixos/nix:latest
  script:
    - >
      nix
      --extra-experimental-features nix-command
      --extra-experimental-features flakes
      build
      --print-build-logs
      .#litterbox-web-frontend
  cache: []
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - changes:
        - flake.nix
        - flake.lock
        - frontend/package.json
        - frontend/package-lock.json

nix-files-formatted:
  stage: nix
  needs: []
  image: docker.io/nixos/nix:latest
  script:
    - >
      nix
      --extra-experimental-features nix-command
      --extra-experimental-features flakes
      run
      nixpkgs#alejandra
      --
      --check
      .
  cache: []
  rules:
    - changes:
        - "**/*.nix"

################################################################################
# deploy

publish-python-packages:
  stage: deploy
  needs: []
  image: docker.io/library/python:latest
  before_script:
    - pip install uv
  script:
    - cd connectors/api/
    # generate a unique version number by using the pipeline ID as build number
    # e.g. replaces `version = "0.1.0"` by `version = "0.1.0-1234"` in pyproject.toml
    - sed -i "s#version = \"\(.*\)\"#version = \"\1-${CI_PIPELINE_IID}\"#" pyproject.toml
    - uv build
    - uv publish --index litterbox-web-gitlab --username "gitlab-ci-token" --password "${CI_JOB_TOKEN}"
  cache: []
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      changes:
        paths:
          - connectors/api/**/*
