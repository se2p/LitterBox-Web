# The one-off import of the old site. Nothing is served while it runs: the target schema is required to be clean,
# and a service taking submissions into it would not leave it that way.
spring:
  main:
    web-application-type: none

litterbox:
  jobs:
    # There is nothing to poll for. The import creates no jobs, and a sweep every few minutes during it is noise.
    poll-millis: 3600000
  legacy-migration:
    # The old schema, read read-only and rolled back. It must not be the schema this service migrates into.
    source-url: ${LITTERBOX_LEGACY_DB_URL:}
    source-username: ${LITTERBOX_LEGACY_DB_USER:}
    source-password: ${LITTERBOX_LEGACY_DB_PASSWORD:}
    # The old web root's own directories.
    uploads-root: ${LITTERBOX_LEGACY_UPLOADS:}
    report-root: ${LITTERBOX_LEGACY_REPORTS:}
    artifact-store-root: ${LITTERBOX_SOURCE_STORAGE_ROOT:}
    report-output: ${LITTERBOX_LEGACY_REPORT_OUTPUT:legacy-migration-report.json}
    locale: ${LITTERBOX_LEGACY_LOCALE:de}
    litterbox-artifact-version: ${LITTERBOX_LEGACY_ARTIFACT_VERSION:legacy}
    # Roll the whole thing back and report what it found, leaving the schema clean for the real run.
    dry-run: ${LITTERBOX_LEGACY_DRY_RUN:true}
